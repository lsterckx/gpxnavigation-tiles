# Gebieden waarvoor tegels gemaakt worden.
#   id         korte naam; ook de bestandsnaam in data/ (data/<id>.osm.pbf en data/<id>.poly)
#   name       naam zoals de app hem toont
#   geofabrik  pad bij https://download.geofabrik.de (zonder -latest.osm.pbf)
#   enabled    false = (nog) niet verwerken
#   municipality_level  admin_level van een gemeente (standaard 8)     } voor "Omgeving" in de app
#   section_level       admin_level van een deelgemeente (standaard 9) } (build_areas.py); geen = leeg laten
#
# Een gebied toevoegen = hier een regel bijzetten. Elk gebied wordt in een eigen job gebouwd (tegelijk); de tegels
# op de grens tussen gebieden worden daarna samengevoegd, zodat ze de wegen van beide bevatten
# (scripts/parts_common.py, scripts/merge_parts.py). Komt een weg in twee gebieden voor, dan telt de versie van het
# gebied dat hier eerst staat.
#
# border_margin_degrees: hoe ver rond de andere gebieden een tegel als randtegel geldt (standaard 0.05, ±4–5 km).
# merge_parts.py stopt met een fout als dat te weinig is; verhoog het dan.
border_margin_degrees: 0.05

regions:
  - id: belgium
    name: België
    geofabrik: europe/belgium
    enabled: true
  # Nederland: voorlopig niet (03/11/2026), om ruimte te houden voor Frankrijk en Oostenrijk.
  - id: netherlands
    name: Nederland
    geofabrik: europe/netherlands
    enabled: false
  - id: luxembourg
    name: Luxemburg
    geofabrik: europe/luxembourg
    enabled: true

  # De Eifel (fase 5)
  - id: rheinland-pfalz
    name: Rheinland-Pfalz
    geofabrik: europe/germany/rheinland-pfalz
    enabled: true
  - id: koeln-regbez
    name: Regierungsbezirk Köln
    geofabrik: europe/germany/nordrhein-westfalen/koeln-regbez
    enabled: true

  # Voor het voorjaar van 2027 (fase 5)
  - id: spain
    name: Spanje
    geofabrik: europe/spain
    enabled: true
  - id: portugal
    name: Portugal
    geofabrik: europe/portugal
    enabled: true
    municipality_level: 7   # concelho
    section_level: 8        # freguesia

  # Frankrijk: alleen de regio's tegen België en Luxemburg (heel Frankrijk past niet in één run).
  # Geofabrik gebruikt nog de oude regio's van voor 2016.
  - id: nord-pas-de-calais
    name: Nord-Pas-de-Calais
    geofabrik: europe/france/nord-pas-de-calais
    enabled: true
  - id: picardie
    name: Picardie
    geofabrik: europe/france/picardie
    enabled: true
  - id: champagne-ardenne
    name: Champagne-Ardenne
    geofabrik: europe/france/champagne-ardenne
    enabled: true
  - id: lorraine
    name: Lorraine
    geofabrik: europe/france/lorraine
    enabled: true

  # Oostenrijk (ongeveer 0,8 GB): klaar om aan te zetten.
  - id: austria
    name: Oostenrijk
    geofabrik: europe/austria
    enabled: false
