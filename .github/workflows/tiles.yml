# Elke maand de tegels maken en opladen naar Cloudflare R2, in een gesplitste run:
#
#   plan   -> welke gebieden (enabled in regions.yml), tests
#   part   -> één job per gebied, tegelijk: downloaden bij Geofabrik, wegtegels, watertegels, haltes,
#             omgevingsgegevens.
#             De eigen tegels (ver van elk ander gebied) worden meteen opgeladen; de randtegels gaan als artefact
#             naar merge (zie scripts/parts_common.py).
#   merge  -> randtegels samenvoegen en opladen (scripts/merge_parts.py), verdwenen tegels wissen, overzichts-
#             bestanden, controle via het publieke adres, status.json terugschrijven.
#   report -> altijd een mail met het resultaat (scripts/report_mail.py; secrets MAIL_USERNAME en MAIL_PASSWORD).
#
# - Een tegel waar niets in veranderde, blijft byte voor byte gelijk en wordt niet opnieuw opgeladen (rclone
#   vergelijkt de MD5).
# - Mislukt een gebied, dan worden de eigen tegels van de andere gebieden wel bijgewerkt, maar de randtegels en de
#   overzichtsbestanden niet (merge draait dan niet); GitHub mailt. Wat in R2 staat, blijft bruikbaar.
# - merge mislukt als de marge rond de gebieden te klein was (verhoog border_margin_degrees in regions.yml) of als
#   alle tegels samen groter zijn dan 8 GB.
# - status.json in de repository houdt de geplande run actief (GitHub zet die anders stil na 60 dagen zonder
#   activiteit).
# - Met de hand starten: Actions -> Tegels maken en opladen -> Run workflow.
#
# Nodige secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (zie het plan van aanpak, fase 0);
# voor de mail MAIL_USERNAME en MAIL_PASSWORD.

name: Tegels maken en opladen

on:
  schedule:
    # De 1e van elke maand om 02:00 UTC (03:00 of 04:00 in België). De cache van Cloudflare bewaart een tegel
    # 1 uur, dus een paar uur na de run is de nieuwe versie overal beschikbaar.
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Tegels opladen naar R2 (uit = alleen maken, om te testen)"
        type: boolean
        default: true
      allow_many_deletes:
        description: "Meer dan 5% van de tegels in R2 mag gewist worden (bv. na het uitzetten van een gebied)"
        type: boolean
        default: false

permissions:
  contents: write   # status.json terugschrijven

concurrency:
  group: tiles
  cancel-in-progress: false

env:
  BUCKET: gpxnavigation-tiles
  # Geen naam die met RCLONE_ begint: rclone leest die zelf als optie (RCLONE_VERSION = --version).
  RCLONE_DEB_VERSION: v1.71.2
  RCLONE_DEB_SHA256: 68c961e4aa1bbdf10d3264ec87eb649934f9c75c85c109c72ac43cf6a5fe9c90
  UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      regions: ${{ steps.regions.outputs.regions }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          rclone: "false"
      - name: Test
        run: |
          python3 tests/test_tiles.py
          python3 tests/test_areas.py
          python3 tests/test_water.py
          python3 tests/test_transit.py
          python3 tests/test_parts.py
      - name: Gebieden
        id: regions
        run: |
          regions=$(python3 -c "
          import json, sys
          sys.path.insert(0, 'scripts')
          import parts_common as pc
          print(json.dumps([r['id'] for r in pc.enabled_regions(pc.load_config('regions.yml'))]))")
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Gebieden: $regions"

  part:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300   # GitHub staat maximaal 360 toe
    strategy:
      fail-fast: false
      # Niet te veel tegelijk downloaden bij Geofabrik.
      max-parallel: 4
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    env:
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Downloaden bij Geofabrik
        run: |
          python3 scripts/fetch_regions.py --only "$REGION"
          # De omtrek van alle gebieden: om te weten welke tegels randtegels zijn.
          python3 scripts/fetch_regions.py --polys-only

      - name: Wegtegels maken
        run: python3 scripts/build_tiles.py --part "$REGION" --max-gb 8

      - name: Omgevingsgegevens maken (gemeenten, deelgemeenten, plaatsen)
        run: python3 scripts/build_areas.py --only "$REGION" --out "parts/$REGION"

      - name: Water maken (waterlopen en watervlakken)
        run: python3 scripts/build_water.py --part "$REGION"

      - name: Haltes maken (bus, tram, metro, trein, taxi, veerboot)
        run: python3 scripts/build_transit.py --part "$REGION"

      - name: Eigen tegels opladen naar R2
        if: env.UPLOAD == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          source scripts/r2-env.sh
          upload_tiles "parts/$REGION/final/14" 14
          for layer in water transit; do
            if [ -d "parts/$REGION/final/$layer/14" ]; then upload_tiles "parts/$REGION/final/$layer/14" "$layer/14"; fi
          done

      - name: Randtegels doorgeven
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.region }}
          path: |
            parts/${{ matrix.region }}
            !parts/${{ matrix.region }}/final
          retention-days: 3
          compression-level: 1   # de bestanden zijn al gzip

  merge:
    needs: part
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Randtegels ophalen
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts

      - name: Randtegels samenvoegen
        shell: bash
        run: |
          mkdir -p report
          # Ook in de mail (report_mail.py): bij een fout de laatste regels.
          python3 scripts/merge_parts.py --max-gb 8 2>&1 | tee report/merge.log

      - name: Opladen naar R2 en verdwenen tegels wissen
        if: env.UPLOAD == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ALLOW_MANY_DELETES: ${{ inputs.allow_many_deletes || false }}
        shell: bash
        run: |
          mkdir -p report
          exec > >(tee -a report/upload.log) 2>&1
          source scripts/r2-env.sh
          upload_tiles out/14 14
          for layer in water transit; do
            if [ -d "out/$layer/14" ]; then upload_tiles "out/$layer/14" "$layer/14"; fi
          done

          # Verdwenen tegels wissen: wat in R2 staat maar in geen enkel deel meer voorkomt. Nooit meer dan 5%
          # (tenzij allow_many_deletes): een fout in de lijsten mag niet alle tegels wissen.
          for layer in 14 water transit; do
            dest="14"; [ "$layer" != "14" ] && dest="$layer/14"
            rclone lsf -R --files-only --fast-list "r2:$BUCKET/$dest" | sort > "/tmp/present-$layer.txt"
            sort "out/expected-$layer.txt" > "/tmp/expected-$layer.txt"
            comm -23 "/tmp/present-$layer.txt" "/tmp/expected-$layer.txt" > "/tmp/delete-$layer.txt"
            present=$(wc -l < "/tmp/present-$layer.txt"); n=$(wc -l < "/tmp/delete-$layer.txt")
            echo "$dest: $present in R2, $n te wissen"
            if [ "$n" -gt 0 ]; then
              if [ "$ALLOW_MANY_DELETES" != "true" ] && [ $((n * 20)) -gt "$present" ]; then
                echo "::error::$n van de $present tegels onder $dest zouden gewist worden (meer dan 5%). Niets gewist."
                exit 1
              fi
              rclone delete "r2:$BUCKET/$dest" --files-from "/tmp/delete-$layer.txt" --fast-list
            fi
          done

          # Omgevingsgegevens per gebied (klein): gemeenten, deelgemeenten, plaatsen.
          rclone sync out/areas "r2:$BUCKET/areas" --checksum --exclude index.json \
            --header-upload "Content-Type: application/gzip" \
            --header-upload "Cache-Control: public, max-age=3600"
          rclone copyto out/areas/index.json "r2:$BUCKET/areas/index.json" \
            --header-upload "Content-Type: application/json" \
            --header-upload "Cache-Control: public, max-age=3600"
          # Overzichtsbestanden: altijd opnieuw (klein).
          for f in out/regions.json out/status.json ATTRIBUTION.txt; do
            rclone copyto "$f" "r2:$BUCKET/$(basename "$f")" \
              --header-upload "Cache-Control: public, max-age=3600"
          done

      - name: Controle via het publieke adres
        if: env.UPLOAD == 'true'
        run: |
          # Eén echte tegel (de grootste) en regions.json moeten bereikbaar zijn.
          tile=$(python3 -c "import json;print(json.load(open('out/status.json'))['largest_tiles'][0]['tile'])")
          for path in "$tile" regions.json areas/index.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://tiles.data-tech-up.com/$path?run=$GITHUB_RUN_ID")
            echo "$path: HTTP $code"
            test "$code" = "200"
          done

      - name: status.json terugschrijven
        if: env.UPLOAD == 'true'
        run: |
          cp out/status.json status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "Tegels bijgewerkt: $(python3 -c "import json;s=json.load(open('status.json'));print(f\"{s['tiles']} tegels, {s['bytes_total']/1e6:.0f} MB\")")" || exit 0
          # Tijdens de run kan er een nieuwe commit op main gekomen zijn (03/11/2026: push geweigerd).
          git pull --rebase -q origin main
          git push

      - name: Samenvatting
        if: always()
        run: |
          test -f out/status.json || exit 0
          mkdir -p report
          python3 - <<'EOF' > report/summary.md
          import json, os
          s = json.load(open("out/status.json"))
          print("## Tegels")
          print(f"- Gebieden: {', '.join(s['regions'])}")
          print(f"- Tegels: {s['tiles']} ({s['tiles_complete']} volledig, {s['tiles_empty']} leeg, "
                f"{s['tiles_merged']} samengevoegde randtegels)")
          print(f"- Wegen: {s['ways']}, oversteekknopen: {s['crossing_nodes']}")
          print(f"- Grootte: {s['bytes_total'] / 1e6:.1f} MB, mediaan {s['bytes_median'] / 1000:.1f} kB, "
                f"grootste {s['bytes_max'] / 1000:.1f} kB")
          print(f"- Duur van het maken (langste gebied + samenvoegen): {s['duration_seconds']} s")
          if os.path.exists("out/areas/index.json"):
              print("## Omgevingsgegevens")
              for r in json.load(open("out/areas/index.json"))["regions"]:
                  c = r["counts"]
                  print(f"- {r['name']}: {c['municipalities']} gemeenten, {c['sections']} deelgemeenten, "
                        f"{c['places']} plaatsen, {r['bytes'] / 1000:.0f} kB")
          if os.path.exists("out/water/status.json"):
              w = json.load(open("out/water/status.json"))
              print("## Water")
              print(f"- {w['tiles']} tegels, {w['bytes_total'] / 1e6:.1f} MB, {w['waterways']} waterlopen, "
                    f"{w['water']} watervlakken")
          if os.path.exists("out/transit/status.json"):
              t = json.load(open("out/transit/status.json"))
              print("## Haltes")
              print(f"- {t['tiles']} tegels, {t['bytes_total'] / 1e6:.1f} MB, " +
                    ", ".join(f"{k}: {v}" for k, v in t["counts"].items()))
          EOF
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Gegevens voor de mail doorgeven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report
          if-no-files-found: ignore
          retention-days: 3

  # Op het einde altijd een mail met het resultaat (ook als een gebied of het samenvoegen mislukte).
  # Nodige secrets: MAIL_USERNAME (Gmail-adres, ook de ontvanger) en MAIL_PASSWORD (app-wachtwoord van Google).
  report:
    needs: [plan, part, merge]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read   # mislukte jobs opzoeken
    steps:
      - uses: actions/checkout@v5
      - name: Gegevens ophalen
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: report
          path: report
      - name: Mail met het resultaat
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          RESULT_PLAN: ${{ needs.plan.result }}
          RESULT_PART: ${{ needs.part.result }}
          RESULT_MERGE: ${{ needs.merge.result }}
        run: python3 scripts/report_mail.py --dir report
